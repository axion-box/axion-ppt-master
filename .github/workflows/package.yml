name: Build and publish axion-ppt-master

"on":
  push:
    branches:
      - main
      - develop
    tags:
      - "v*.*.*"
      - "V*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axion-ppt-master-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_BUILDER_IMAGE: axion-registry.cn-beijing.cr.aliyuncs.com/axion/package-builder:1.3.0-debian12-arm64

jobs:
  release:
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - aliyun-hk
    timeout-minutes: 180

    steps:
      - name: Repair workspace ownership
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          if [[ -d "${GITHUB_WORKSPACE}" ]]; then
            sudo chown -R --no-dereference \
              "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}"
          fi

      - name: Check out complete release repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: ppt-master
          persist-credentials: false

      - name: Resolve immutable release metadata
        id: metadata
        shell: bash
        working-directory: ppt-master
        run: |
          set -euo pipefail
          python3 packaging/ci_version.py >>"${GITHUB_OUTPUT}"

      - name: Prepare private ARM64 runner
        if: steps.metadata.outputs.publish_repositories != ''
        shell: bash
        run: |
          set -euo pipefail
          command -v docker >/dev/null
          command -v axion-aptly-publish >/dev/null
          test "$(uname -m)" = aarch64
          sudo -H env docker pull "${PACKAGE_BUILDER_IMAGE}"

      - name: Verify repository and packaging contracts
        if: steps.metadata.outputs.publish_repositories != ''
        shell: bash
        working-directory: ppt-master
        run: |
          set -euo pipefail
          python3 skills/ppt-master/scripts/attribution_guard.py
          python3 -m compileall -q packaging skills/ppt-master/scripts
          bash -n packaging/scripts/install.sh packaging/scripts/uninstall.sh packaging/scripts/postinst
          test "$(git ls-files -- skills/ppt-master | wc -l)" -gt 0
          ! grep -R -E 'uses:[[:space:]]*actions/(upload|download)-artifact@' \
            .github/workflows

      - name: Build, verify, and publish Deb and TGZ
        if: steps.metadata.outputs.publish_repositories != ''
        shell: bash
        run: |
          set -euo pipefail
          sudo -H env \
            GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=safe.directory \
            GIT_CONFIG_VALUE_0="${GITHUB_WORKSPACE}/ppt-master" \
            python3 ppt-master/packaging/release.py \
            --repository-root ppt-master \
            --tarball-version "${{ steps.metadata.outputs.tarball_version }}" \
            --debian-version "${{ steps.metadata.outputs.deb_version }}" \
            --repositories "${{ steps.metadata.outputs.publish_repositories }}" \
            --architecture arm64

      - name: Report tagged branch skip
        if: steps.metadata.outputs.publish_repositories == ''
        shell: bash
        run: |
          printf '%s\n' "commit is release-tagged; only the tag run publishes it"

      - name: Restore workspace ownership
        if: always()
        shell: bash
        run: |
          sudo chown -R -- "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}"
